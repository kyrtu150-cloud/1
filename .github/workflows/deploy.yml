name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/trusting-shannon-7oqcqu
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем один параллельный деплой, не отменяя уже идущий.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включает Pages при первом запуске, если есть права.
          enablement: true

      - name: Build
        env:
          # base-path для project pages = "/<repo>/", напр. "/1/"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback + .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
